<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Galaxy API 自媒体数据采集分析平台</title>
  <desc id="desc">小红书、抖音数据采集，数据中心整理导出，评论与内容分析报告，以及统一 API 接入。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e1145"/>
      <stop offset=".55" stop-color="#3b1a8a"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#a78bfa" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#12062e" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="210" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="#ddd6fe" stroke-opacity=".12">
    <circle cx="1010" cy="210" r="170"/>
    <circle cx="1010" cy="210" r="235"/>
    <circle cx="1010" cy="210" r="300"/>
  </g>

  <g font-family="Inter,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif">
    <!-- 品牌 -->
    <g transform="translate(64 54)">
      <rect width="40" height="40" rx="12" fill="#ffffff"/>
      <circle cx="20" cy="20" r="9" fill="none" stroke="#7c3aed" stroke-width="3"/>
      <circle cx="29" cy="11" r="3.5" fill="#7c3aed"/>
      <text x="54" y="29" fill="#ffffff" font-size="26" font-weight="700" letter-spacing="1.5">GALAXY API</text>
    </g>

    <!-- 标题 -->
    <text x="64" y="176" fill="#ffffff" font-size="58" font-weight="800">自媒体数据采集分析平台</text>
    <text x="66" y="226" fill="#ddd6fe" font-size="24">读懂数据，发现价值：从采集、整理到分析，一站完成。</text>

    <!-- 三种使用方式 -->
    <g font-size="18" font-weight="600" fill="#ffffff">
      <rect x="64" y="262" width="168" height="44" rx="22" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".28"/>
      <text x="148" y="290" text-anchor="middle">无代码工作台</text>
      <rect x="246" y="262" width="168" height="44" rx="22" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".28"/>
      <text x="330" y="290" text-anchor="middle">数据分析报告</text>
      <rect x="428" y="262" width="168" height="44" rx="22" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".28"/>
      <text x="512" y="290" text-anchor="middle">统一 API 接入</text>
    </g>

    <line x1="64" y1="346" x2="700" y2="346" stroke="#ddd6fe" stroke-opacity=".22"/>
    <text x="64" y="388" fill="#c4b5fd" font-size="18">小红书 · 抖音 · 蒲公英 · 哔哩哔哩　|　成功请求才计费</text>

    <!-- 右侧：数据卡片示意 -->
    <g filter="url(#shadow)">
      <rect x="800" y="70" width="390" height="300" rx="20" fill="#ffffff"/>
    </g>
    <g transform="translate(800 70)">
      <circle cx="28" cy="26" r="5" fill="#f87171"/>
      <circle cx="46" cy="26" r="5" fill="#fbbf24"/>
      <circle cx="64" cy="26" r="5" fill="#34d399"/>
      <text x="364" y="31" text-anchor="end" fill="#6b7280" font-size="14">数据中心</text>
      <line x1="0" y1="50" x2="390" y2="50" stroke="#ede9fe"/>

      <!-- 指标 -->
      <text x="28" y="86" fill="#6b7280" font-size="13">笔记</text>
      <text x="28" y="114" fill="#111113" font-size="26" font-weight="700">1,500</text>
      <text x="152" y="86" fill="#6b7280" font-size="13">评论</text>
      <text x="152" y="114" fill="#111113" font-size="26" font-weight="700">16,308</text>
      <text x="282" y="86" fill="#6b7280" font-size="13">互动量</text>
      <text x="282" y="114" fill="#7c3aed" font-size="26" font-weight="700">↑ 38%</text>

      <!-- 柱状图 -->
      <g fill="url(#bar)">
        <rect x="32" y="196" width="30" height="46" rx="6"/>
        <rect x="80" y="178" width="30" height="64" rx="6"/>
        <rect x="128" y="186" width="30" height="56" rx="6"/>
        <rect x="176" y="160" width="30" height="82" rx="6"/>
        <rect x="224" y="170" width="30" height="72" rx="6"/>
        <rect x="272" y="142" width="30" height="100" rx="6"/>
        <rect x="320" y="150" width="30" height="92" rx="6"/>
      </g>
      <line x1="28" y1="243" x2="362" y2="243" stroke="#e5e7eb"/>

      <!-- 导出 -->
      <rect x="28" y="258" width="92" height="28" rx="14" fill="#f5f3ff"/>
      <text x="74" y="277" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="600">Excel</text>
      <rect x="130" y="258" width="76" height="28" rx="14" fill="#f5f3ff"/>
      <text x="168" y="277" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="600">CSV</text>
      <rect x="216" y="258" width="146" height="28" rx="14" fill="#7c3aed"/>
      <text x="289" y="277" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">提交评论分析</text>
    </g>

    <text x="1190" y="404" text-anchor="end" fill="#ddd6fe" font-size="18" font-weight="600">galaxysapi.com</text>
  </g>
</svg>
